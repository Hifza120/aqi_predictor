name: Hourly Feature Pipeline

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  fetch-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          echo "AQICN_TOKEN=${{ secrets.AQICN_TOKEN }}" > pipelines/.env

      - name: Apply Feast definitions
        run: |
          cd pipelines/feature_repo
          feast apply

      - name: Run fetch_data.py (push live features to online store)
        run: |
          cd pipelines
          python fetch_data.py

      - name: Commit updated online store (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pipelines/feature_repo/data/

          git diff --cached --quiet || \
          git commit -m "chore: hourly feature update $(date -u '+%Y-%m-%d %H:%M UTC')"

          git push
