name: Daily Training Pipeline

on:
  schedule:
    - cron: "0 2 * * *"   # every day at 02:00 UTC
  workflow_dispatch:        # manual trigger

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        run: |
          echo "AQICN_TOKEN=${{ secrets.AQICN_TOKEN }}" > pipelines/.env

      - name: Run feature store pipeline (backfill + materialize)
        run: |
          cd pipelines
          python feature_store_pipeline.py

      - name: Run model training
        run: |
          cd pipelines
          python model_training.py

      - name: Commit updated models + SHAP plots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipelines/models/
          git diff --cached --quiet || git commit -m "chore: daily retrain $(date -u '+%Y-%m-%d')"
          git push
